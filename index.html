<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#064e3b" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0f0d" media="(prefers-color-scheme: dark)" />
    <!-- Apply the saved/system theme before paint to avoid a light flash on dark devices. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('fujitex-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          var root = document.documentElement;
          root.classList.toggle('dark', t === 'dark');
          root.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="Fujitex — Premium Men's Fabric, Lahore. Cotton, Karandi, Latha, Wash & Wear. COD, JazzCash, NayaPay. Pan-Pakistan shipping." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" />
    <title>Fujitex — Premium Men's Fabric, Lahore</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
